<script>
  // Add a bottom rule to the nav once it sticks to the top of the window.
  (function () {
    var nav = document.querySelector('nav.primary');
    var header = document.querySelector('header.site-head');
    if (!nav || !header || !('IntersectionObserver' in window)) return;
    new IntersectionObserver(function (entries) {
      nav.classList.toggle('stuck', !entries[0].isIntersecting);
    }).observe(header);
  })();
</script>
